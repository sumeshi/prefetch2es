name: publish-release

on:
  push:
    branches:
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.create_tag.outputs.version }}
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install uv

      - name: Get version
        id: get_version
        run: |
          version=$(python -c "import re; from pathlib import Path; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', Path('src/prefetch2es/__about__.py').read_text()).group(1))")
          echo "version=$version" >> $GITHUB_ENV
        shell: bash

      - name: run python
        run: |
          uv run prefetch2es -h
          uv run prefetch2es -v
          uv run prefetch2json -h
          uv run prefetch2json -v
      
      - name: Prepare corresponding sources and build libscca
        run: uv run --locked python .github/prepare_release_sources.py dist/sources

      - name: Collect runtime licenses
        run: uv run --no-sync python .github/collect_runtime_licenses.py dist/LICENSES.txt

      - name: build
        run: |
          uv run --no-sync python -m nuitka --standalone --onefile --follow-imports -o prefetch2es --output-dir=dist --assume-yes-for-downloads src/prefetch2es/views/Prefetch2esView.py
          uv run --no-sync python -m nuitka --standalone --onefile --follow-imports -o prefetch2json --output-dir=dist --assume-yes-for-downloads src/prefetch2es/views/Prefetch2jsonView.py
      
      - name: verify
        run: |
          dist/prefetch2es.exe -h
          dist/prefetch2es.exe -v
          dist/prefetch2json.exe -h
          dist/prefetch2json.exe -v
        shell: bash
      
      - name: Create tag
        id: create_tag
        if: startsWith(github.ref, 'refs/heads/master')
        run: |
          git tag "v$version"
          git push origin "v$version"
          echo "version=$version" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Bundle release assets
        run: |
          bundle="dist/prefetch2es-windows-x64-v${{ steps.create_tag.outputs.version }}"
          mkdir -p "$bundle"
          mv dist/prefetch2es.exe "$bundle/prefetch2es.exe"
          mv dist/prefetch2json.exe "$bundle/prefetch2json.exe"
          cp dist/LICENSES.txt "$bundle/LICENSES.txt"
          cp -R dist/sources "$bundle/sources"
          python -c "import shutil; shutil.make_archive(r'$bundle', 'zip', root_dir=r'$bundle')"
        shell: bash

      - name: create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.create_tag.outputs.version }}
          files: |
            dist/prefetch2es-windows-x64-v${{ steps.create_tag.outputs.version }}.zip
          name: Release v${{ steps.create_tag.outputs.version }}
          body: 'This release was automatically created by GitHub Actions.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.13']
    env:
      version: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt install patchelf build-essential
          pip install uv

      - name: run python
        run: |
          uv run prefetch2es -h
          uv run prefetch2es -v
          uv run prefetch2json -h
          uv run prefetch2json -v

      - name: Prepare corresponding sources and build libscca
        run: uv run --locked python .github/prepare_release_sources.py dist/sources

      - name: Collect runtime licenses
        run: uv run --no-sync python .github/collect_runtime_licenses.py dist/LICENSES.txt

      - name: build
        run: |
          pip install nuitka
          uv run --no-sync python -m nuitka --standalone --onefile --follow-imports -o prefetch2es --output-dir=dist --assume-yes-for-downloads src/prefetch2es/views/Prefetch2esView.py
          uv run --no-sync python -m nuitka --standalone --onefile --follow-imports -o prefetch2json --output-dir=dist --assume-yes-for-downloads src/prefetch2es/views/Prefetch2jsonView.py
      
      - name: verify
        run: |
          dist/prefetch2es -h
          dist/prefetch2es -v
          dist/prefetch2json -h
          dist/prefetch2json -v

      - name: Bundle release assets
        run: |
          bundle="dist/prefetch2es-linux-x64-v${{ needs.build-windows.outputs.version }}"
          mkdir -p "$bundle"
          mv dist/prefetch2es "$bundle/prefetch2es"
          mv dist/prefetch2json "$bundle/prefetch2json"
          cp dist/LICENSES.txt "$bundle/LICENSES.txt"
          cp -R dist/sources "$bundle/sources"
          python -c "import shutil; shutil.make_archive(r'$bundle', 'zip', root_dir=r'$bundle')"
        shell: bash

      - name: upload asset to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          files: |
            dist/prefetch2es-linux-x64-v${{ needs.build-windows.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
