[project]
name = "prefetch2es"
dynamic = ["version"]
description = "A library for fast parse & import of Windows Prefetch into Elasticsearch."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sumeshi", email = "sum3sh1@protonmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "elasticsearch==9.4.1",
    "orjson==3.11.9",
    "tqdm==4.67.3",
    "urllib3==2.7.0",
    "libscca-python==20260527",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/prefetch2es/__about__.py"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "nuitka==4.1.2",
    "pytest>=9.0.3",
]

[project.scripts]
prefetch2es = 'prefetch2es.views.Prefetch2esView:entry_point'
prefetch2json = 'prefetch2es.views.Prefetch2jsonView:entry_point'
