[project]
name = "prefetch2es"
dynamic = ["version"]
description = "A library for fast parse & import of Windows Prefetch into Elasticsearch."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sumeshi", email = "sum3sh1@protonmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "elasticsearch==9.5.1",
    "orjson==3.13.0",
    "tqdm==4.70.1",
    "urllib3==2.8.0",
    "libscca-python==20260527",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/prefetch2es/__about__.py"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "nuitka==4.3",
    "pytest>=9.1.1",
]

[project.scripts]
prefetch2es = 'prefetch2es.views.Prefetch2esView:entry_point'
prefetch2json = 'prefetch2es.views.Prefetch2jsonView:entry_point'
